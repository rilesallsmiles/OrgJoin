document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Fnav>\n<\u002Fheader>\n<\u002Fdiv>\n\n<section style=\"background:#F1EDF7\">\n<div class=\"wrap\" style=\"padding-top:96px;padding-bottom:88px\">\n<p class=\"eyebrow\">Riley Hall, Founder &amp; Principal<\u002Fp>\n<h1 class=\"hero-h\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:700;font-size:76px;line-height:1.02;color:#43306A;margin:0 auto 26px;max-width:900px\">Strong teams.<br><span style=\"color:#6B4C9A\">Broken joints.<\u002Fspan><\u002Fh1>\n<p style=\"font-size:22px;line-height:1.5;color:#3C4642;margin:0 auto 38px;max-width:680px\">Your company has outgrown informal coordination. I find where execution breaks between functions, decisions, systems, and people, then install just enough structure to move fast again.<\u002Fp>\n<div style=\"display:flex;justify-content:center;gap:14px;flex-wrap:wrap\">\n<a class=\"btn\" href=\"{{bookingUrl}}\" target=\"_blank\" rel=\"noopener\">Book a 30 minute call<\u002Fa>\n<a class=\"btn-ghost\" href=\"https://www.linkedin.com/in/hall-riley\">Connect on LinkedIn<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg aria-hidden=\"true\" width=\"100%\" height=\"24\" style=\"display:block;background:#FFFFFF\"><defs><pattern id=\"dovetail\" width=\"64\" height=\"24\" sc-camel-pattern-units=\"userSpaceOnUse\"><polygon points=\"18,0 46,0 56,24 8,24\" fill=\"#F1EDF7\"><\u002Fpolygon><\u002Fpattern><\u002Fdefs><rect width=\"100%\" height=\"24\" fill=\"url(#dovetail)\"><\u002Frect><\u002Fsvg>\n<\u002Fsection>\n\n<section class=\"sec\" style=\"padding-bottom:64px\">\n<div class=\"wrap\" style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;text-align:left;margin-bottom:32px\">\n<div>\n<p class=\"eyebrow\">Where I help<\u002Fp>\n<h2 class=\"h2\" style=\"margin:0;max-width:600px\">Five places where good teams get stuck.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px\">\n<button class=\"arrow\" type=\"button\" aria-label=\"Previous\" sc-camel-on-click=\"{{prev}}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button class=\"arrow\" type=\"button\" aria-label=\"Next\" sc-camel-on-click=\"{{next}}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1184px;margin:0 auto\">\n<div class=\"track\" ref=\"{{setTrack}}\">\n<div class=\"slide\"><p class=\"eyebrow\" style=\"margin:0\">01 / 05<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#43306A;margin:0\">Operating model &amp; organizational design<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Clarify roles, interfaces, decision rights, escalation paths, and where work should live.<\u002Fp><\u002Fdiv>\n<div class=\"slide\"><p class=\"eyebrow\" style=\"margin:0\">02 / 05<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#43306A;margin:0\">Business &amp; commercial operations<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Improve pricing, forecasting, customer lifecycle, revenue processes, resource allocation, and operating discipline.<\u002Fp><\u002Fdiv>\n<div class=\"slide\"><p class=\"eyebrow\" style=\"margin:0\">03 / 05<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#43306A;margin:0\">Management systems<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Build the KPIs, dashboards, planning rhythms, operating reviews, and accountability mechanisms leaders need to run the business.<\u002Fp><\u002Fdiv>\n<div class=\"slide\"><p class=\"eyebrow\" style=\"margin:0\">04 / 05<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#43306A;margin:0\">Cross-functional transformation<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Lead high-stakes work that spans Sales, Product, Operations, Finance, Customer Success, and executive teams.<\u002Fp><\u002Fdiv>\n<div class=\"slide\"><p class=\"eyebrow\" style=\"margin:0\">05 / 05<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#43306A;margin:0\">AI-enabled workflow redesign<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Turn recurring administrative work and institutional knowledge into repeatable workflows while preserving human judgment where it matters.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<svg aria-hidden=\"true\" width=\"100%\" height=\"24\" style=\"display:block;background:#43306A\"><defs><pattern id=\"dt2\" width=\"64\" height=\"24\" sc-camel-pattern-units=\"userSpaceOnUse\"><polygon points=\"18,0 46,0 56,24 8,24\" fill=\"#FFFFFF\"><\u002Fpolygon><\u002Fpattern><\u002Fdefs><rect width=\"100%\" height=\"24\" fill=\"url(#dt2)\"><\u002Frect><\u002Fsvg>\n<section class=\"sec\" style=\"background:#43306A\">\n<div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:44px\">\n<div>\n<p class=\"eyebrow\" style=\"color:#CDBDE8\">Sound familiar?<\u002Fp>\n<h2 class=\"h2\" style=\"color:#FFFFFF;margin-bottom:0\">Five signs your company has outgrown the way it coordinates.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"bento\" style=\"color:#FFFFFF\">\n<div class=\"wide\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;margin:0;color:#FFFFFF\">The founder is the router.<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.55;color:#E7DFF3\">Growth has outpaced the company’s operating system and the founder is becoming the coordination layer.<\u002Fp><\u002Fdiv>\n<div class=\"wide\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;margin:0;color:#FFFFFF\">Everyone is busy. Nothing is clear.<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.55;color:#E7DFF3\">Good teams are working hard, but handoffs, priorities, or decision ownership are unclear.<\u002Fp><\u002Fdiv>\n<div><svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:22px;line-height:1.2;margin:0;color:#FFFFFF\">You need cadence, not bureaucracy.<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#E7DFF3\">A company needs to move from founder-led execution to a repeatable management cadence without adding bureaucracy.<\u002Fp><\u002Fdiv>\n<div><svg aria-hidden=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke- 0\">05 / 05<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;color:#43306A;margin:0\">AI-enabled workflow redesign<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Turn recurring administrative work and institutional knowledge into repeatable workflows while preserving human judgment where it matters.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<svg aria-hidden=\"true\" width=\"100%\" height=\"24\" style=\"display:block;background:#43306A\"><defs><pattern id=\"dt2-dc-static\" width=\"64\" height=\"24\" patternUnits=\"userSpaceOnUse\"><polygon points=\"18,0 46,0 56,24 8,24\" fill=\"#FFFFFF\"><\u002Fpolygon><\u002Fpattern><\u002Fdefs><rect width=\"100%\" height=\"24\" fill=\"url(#dt2-dc-static)\"><\u002Frect><\u002Fsvg>\n<section class=\"sec\" style=\"background:#43306A\">\n<div class=\"wrap\" style=\"display:flex;flex-direction:column;gap:44px\">\n<div>\n<p class=\"eyebrow\" style=\"color:#CDBDE8\">Sound familiar?<\u002Fp>\n<h2 class=\"h2\" style=\"color:#FFFFFF;margin-bottom:0\">Five signs your company has outgrown the way it coordinates.<\u002Fh2>\n<\u002Fdiv>\n<div class=\"bento\" style=\"color:#FFFFFF\">\n<div class=\"wide\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;margin:0;color:#FFFFFF\">The founder is the router.<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.55;color:#E7DFF3\">Growth has outpaced the company’s operating system and the founder is becoming the coordination layer.<\u002Fp><\u002Fdiv>\n<div class=\"wide\"><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:24px;line-height:1.2;margin:0;color:#FFFFFF\">Everyone is busy. Nothing is clear.<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.55;color:#E7DFF3\">Good teams are working hard, but handoffs, priorities, or decision ownership are unclear.<\u002Fp><\u002Fdiv>\n<div><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:22px;line-height:1.2;margin:0;color:#FFFFFF\">You need cadence, not bureaucracy.<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#E7DFF3\">A company needs to move from founder-led execution to a repeatable management cadence without adding bureaucracy.<\u002Fp><\u002Fdiv>\n<div><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:22px;line-height:1.2;margin:0;color:#FFFFFF\">Demand isn’t the problem.<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#E7DFF3\">Commercial performance is constrained by pricing, lifecycle, pipeline, forecasting, or cross-functional seams rather than demand alone.<\u002Fp><\u002Fdiv>\n<div><svg aria-hidden=\"true\" width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#CDBDE8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M8 12.5l2.5 2.5L16 9.5\"><\u002Fpath><\u002Fsvg><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:22px;line-height:1.2;margin:0;color:#FFFFFF\">You need a builder, not a deck.<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#E7DFF3\">Leadership needs an embedded operator to diagnose the problem, design the mechanism, and stay through implementation.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<svg aria-hidden=\"true\" width=\"100%\" height=\"24\" style=\"display:block;background:#F1EDF7\"><defs><pattern id=\"dt3-dc-static\" width=\"64\" height=\"24\" patternUnits=\"userSpaceOnUse\"><polygon points=\"18,0 46,0 56,24 8,24\" fill=\"#43306A\"><\u002Fpolygon><\u002Fpattern><\u002Fdefs><rect width=\"100%\" height=\"24\" fill=\"url(#dt3-dc-static)\"><\u002Frect><\u002Fsvg>\n<section class=\"sec\" style=\"background:#F1EDF7\">\n<div class=\"wrap\">\n<p class=\"eyebrow\">How I work<\u002Fp>\n<h2 class=\"h2\">Diagnose. Design. Install.<\u002Fh2>\n<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(280px,1fr))\">\n<div style=\"background:#FFFFFF;padding:28px\"><div class=\"metric\">01<\u002Fdiv><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:22px;color:#43306A;margin:0 0 10px\">Diagnose<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Map the real operating system: where decisions stall, information breaks, incentives conflict, and leadership is compensating with heroics.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:28px\"><div class=\"metric\">02<\u002Fdiv><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:22px;color:#43306A;margin:0 0 10px\">Design<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Build the minimum viable mechanism: roles, decision rights, workflows, metrics, operating cadence, and systems that fit the company’s stage.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;padding:28px\"><div class=\"metric\">03<\u002Fdiv><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:22px;color:#43306A;margin:0 0 10px\">Install<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.55;color:#4A544F\">Work alongside the team through implementation, adoption, and iteration until the mechanism is usable without depending on the consultant.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<svg aria-hidden=\"true\" width=\"100%\" height=\"24\" style=\"display:block;background:#FFFFFF\"><defs><pattern id=\"dt4-dc-static\" width=\"64\" height=\"24\" patternUnits=\"userSpaceOnUse\"><polygon points=\"18,0 46,0 56,24 8,24\" fill=\"#F1EDF7\"><\u002Fpolygon><\u002Fpattern><\u002Fdefs><rect width=\"100%\" height=\"24\" fill=\"url(#dt4-dc-static)\"><\u002Frect><\u002Fsvg>\n<section class=\"sec\" id=\"about\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:56px;align-items:center;justify-content:center;text-align:left\">\n<div style=\"flex:0 1 360px;aspect-ratio:4 / 5;background:#F1EDF7;border:1px solid #D9CFEA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#6B4C9A;position:relative\">\n<svg aria-hidden=\"true\" width=\"64\" height=\"64\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-size:14px;font-weight:700;letter-spacing:.12em\">[HEADSHOT]<\u002Fspan>\n<div style=\"position:absolute;right:-14px;bottom:-14px;width:72px;height:72px;background:#6B4C9A\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;max-width:560px\">\n<p class=\"eyebrow\">Abo
